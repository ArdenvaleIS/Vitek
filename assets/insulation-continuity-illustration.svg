<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Illustration of continuous insulation compared with an insulation gap</title>
<desc id="desc">Two simplified wall sections. The left shows insulation filling the framed cavity. The right shows a gap in the insulation where a colder area may develop. The actual design depends on the wall assembly.</desc>
<defs>
  <linearGradient id="cold" x1="0" x2="1"><stop offset="0" stop-color="#8fc7d9"/><stop offset="1" stop-color="#e7f4f7"/></linearGradient>
  <linearGradient id="warm" x1="0" x2="1"><stop offset="0" stop-color="#fff0d8"/><stop offset="1" stop-color="#f8c77d"/></linearGradient>
  <pattern id="batt" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M0 14 Q7 2 14 14 T28 14" fill="none" stroke="#9f8a62" stroke-width="3"/></pattern>
</defs>
<rect x="12" y="12" width="576" height="536" rx="18" fill="#f5fafb" stroke="#c8dce3" stroke-width="3"/>
<rect x="612" y="12" width="576" height="536" rx="18" fill="#f5fafb" stroke="#c8dce3" stroke-width="3"/>
<text x="300" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#12354c">More continuous cavity fill</text>
<text x="900" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#12354c">Gap or void in insulation</text>
<!-- left wall -->
<rect x="95" y="110" width="42" height="330" fill="#b9c7cd"/><rect x="463" y="110" width="30" height="330" fill="#e2d4c4"/>
<rect x="137" y="110" width="326" height="330" fill="#f2e9dc" stroke="#c8b79d" stroke-width="2"/>
<rect x="145" y="118" width="310" height="314" fill="#d9c79e"/>
<rect x="145" y="118" width="310" height="314" fill="url(#batt)" opacity=".8"/>
<rect x="137" y="110" width="20" height="330" fill="#9a744d"/><rect x="443" y="110" width="20" height="330" fill="#9a744d"/>
<rect x="80" y="110" width="15" height="330" fill="#6d8796"/><rect x="493" y="110" width="16" height="330" fill="#c8d2d8"/>
<text x="300" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#285467">Insulation appears continuous in this simplified view</text>
<!-- right wall -->
<rect x="695" y="110" width="42" height="330" fill="#b9c7cd"/><rect x="1063" y="110" width="30" height="330" fill="#e2d4c4"/>
<rect x="737" y="110" width="326" height="330" fill="#f2e9dc" stroke="#c8b79d" stroke-width="2"/>
<rect x="745" y="118" width="310" height="314" fill="#d9c79e"/>
<rect x="745" y="118" width="310" height="314" fill="url(#batt)" opacity=".8"/>
<rect x="745" y="246" width="310" height="78" fill="#eaf5f7" stroke="#70a9b9" stroke-dasharray="9 7" stroke-width="3"/>
<rect x="737" y="110" width="20" height="330" fill="#9a744d"/><rect x="1043" y="110" width="20" height="330" fill="#9a744d"/>
<rect x="680" y="110" width="15" height="330" fill="#6d8796"/><rect x="1093" y="110" width="16" height="330" fill="#c8d2d8"/>
<path d="M1095 245 H1125 M1095 325 H1125" stroke="#126b85" stroke-width="5" stroke-linecap="round"/>
<text x="900" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#285467">A discontinuity can create a local cold area</text>
<text x="600" y="526" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#536573">Conceptual illustration only — not a construction detail or a specification for any particular wall.</text>
</svg>